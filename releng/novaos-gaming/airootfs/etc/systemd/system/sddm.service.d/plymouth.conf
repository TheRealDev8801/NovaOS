# NovaOS: keep the Starlight splash on screen until SDDM is ready to draw,
# then make sure Plymouth has fully released the console before SDDM starts.
# Without this the splash can linger over the login screen, or SDDM can start
# before plymouth-quit has given the DRM device back.
[Unit]
After=plymouth-quit-wait.service
Wants=plymouth-quit-wait.service
