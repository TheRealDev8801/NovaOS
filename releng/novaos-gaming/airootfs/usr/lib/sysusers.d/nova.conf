# NovaOS live desktop user (Plasma Nova).
#
# systemd-sysusers accepts exactly ONE group per "m" line — putting multiple
# groups on one line makes it abort the WHOLE file with "Trailing garbage",
# which silently produces an ISO with no live user (SDDM autologin then has
# nobody to log into). Keep one "m" line per group.
g nova 1000
u nova 1000 "NovaOS User" /home/nova /bin/bash
m nova wheel
m nova video
m nova render
m nova audio
m nova input
m nova lp
m nova optical
m nova storage
m nova rfkill
m nova games
m nova power
