# NovaOS initramfs configuration.
#
# The archiso hooks are mandatory: without them the initramfs has no way to
# find and mount the ISO's own squashfs and the system dies at "Switch Root".
# See docs/archiso-profile-requirements.md — this exact file was missing from
# every profile in v0.1, which is what broke booting on real hardware.
#
# plymouth is placed after kms so the splash starts only once the framebuffer
# is available, and before block/archiso so it can take over from early boot.
HOOKS=(base udev microcode modconf kms plymouth memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
